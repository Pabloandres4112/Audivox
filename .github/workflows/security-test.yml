name: Mobile Security Tests

on:
  push:
    branches:
      - develop
    paths:
      - 'Mobile/Audivox/**'
      - '.github/workflows/security-test.yml'
      - 'SECURITY.md'
  pull_request:
    branches:
      - develop
    paths:
      - 'Mobile/Audivox/**'
      - '.github/workflows/security-test.yml'
      - 'SECURITY.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  mobile-security:
    name: Lint, tests and dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/Audivox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/Audivox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test -- --watch=false --runInBand

      - name: Fail on critical vulnerable dependencies
        run: npm audit --audit-level=critical

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
